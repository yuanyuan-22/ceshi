<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>智能问答</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <script src="{% static 'js/auth.js' %}"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #6366f1;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --success: #10b981;
      --sidebar-width: 280px;
    }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .layout { display: flex; width: 100vw; height: 100vh; overflow: hidden; }
    .sidebar {
      width: var(--sidebar-width);
      background: linear-gradient(180deg, #4f46e5 0%, #6366f1 100%);
      color: white;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 100;
    }
    .sidebar-header { text-align: center; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,.2); }
    .sidebar-logo {
      width: 56px; height: 56px; background: rgba(255,255,255,.2); border-radius: 14px;
      margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 28px;
    }
    .sidebar-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .sidebar-subtitle { font-size: 12px; opacity: .8; }
    .sidebar-nav { flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px;
      color: rgba(255,255,255,.92); text-decoration: none; margin-bottom: 6px; cursor: pointer; transition: all .2s;
    }
    .nav-item:hover, .nav-item.active { background: rgba(255,255,255,.18); }
    .nav-icon { width: 24px; text-align: center; flex-shrink: 0; }
    .sidebar-footer { padding-top: 16px; border-top: 1px solid rgba(255,255,255,.2); }
    .main-content {
      margin-left: var(--sidebar-width);
      width: calc(100% - var(--sidebar-width));
      padding: 28px 32px;
      min-height: 100vh;
      height: 100vh;
      overflow-y: auto;
    }
    .content-wrapper { width: 100%; max-width: none; }
    .page-header { margin-bottom: 24px; }
    .page-title { font-size: 26px; font-weight: 700; color: var(--text); }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title::before {
      content: "";
      width: 4px;
      height: 18px;
      background: var(--primary);
      border-radius: 2px;
    }
    .chat-panel { display: flex; flex-direction: column; }
    .chat-box {
      min-height: 400px;
      max-height: 500px;
      overflow-y: auto;
      padding: 16px;
      background: #f9fafb;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .msg { margin-bottom: 16px; }
    .bubble-wrap { display: flex; gap: 12px; align-items: flex-start; }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .user .avatar { background: #e0e7ff; color: #4f46e5; }
    .bot .avatar { background: #dcfce7; color: var(--success); }
    .bubble {
      flex: 1;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user .bubble {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .bot .bubble {
      background: #f3f4f6;
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .input-toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .toolbar-group { display: flex; align-items: center; gap: 8px; }
    select, textarea {
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
    }
    select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
    }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary { background: #f3f4f6; color: var(--text); }
    .btn-send {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      box-shadow: 0 4px 14px rgba(99,102,241,0.4);
    }
    .btn-send:hover { transform: translateY(-2px); }
    .input-row { display: flex; gap: 12px; }
    .input-row textarea {
      flex: 1;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      resize: none;
      min-height: 52px;
    }
    .sources-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed;
    }
    .sources-table th, .sources-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .sources-table th {
      background: #f9fafb;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 12px;
    }
    .json-box {
      background: #1f2937;
      color: #e5e7eb;
      padding: 16px;
      border-radius: 12px;
      font-size: 11px;
      overflow: auto;
      max-height: 260px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: monospace;
    }
    .bottom-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 100%; }
    .trace-step { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: #fff; }
    .trace-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .trace-idx { width: 22px; height: 22px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .trace-tool { font-weight: 700; font-size: 14px; color: #4338ca; }
    .trace-kv { display: flex; gap: 8px; font-size: 12px; margin-top: 4px; align-items: flex-start; }
    .trace-label { color: var(--text-muted); flex-shrink: 0; width: 36px; padding-top: 3px; }
    .trace-kv code { background: #f3f4f6; border-radius: 6px; padding: 3px 8px; word-break: break-all; display: block; flex: 1; font-family: monospace; line-height: 1.5; }
    @media (max-width: 1200px) { .bottom-panels { grid-template-columns: 1fr; } }
    @media (max-width: 1024px) {
      .sidebar { width: 80px; }
      .sidebar-header, .sidebar-footer { display: none; }
      .nav-item span { display: none; }
      .main-content { margin-left: 80px; width: calc(100% - 80px); padding: 24px 16px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    {% include 'partials/app_sidebar.html' with active='qa' %}

    <main class="main-content">
      <div class="content-wrapper">
        <div class="page-header">
          <h1 class="page-title">智能问答</h1>
        </div>

        <div class="card chat-panel">
          <div class="card-title">对话区</div>
          <div id="chatBox" class="chat-box"></div>

          <div class="input-toolbar">
            <div class="toolbar-group">
              <select id="lang">
                <option value="zh" selected>中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
              </select>
            </div>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;">
              <input type="checkbox" id="fastMode">
              <span>快速模式</span>
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:600;color:#4338ca;">
              <input type="checkbox" id="agentMode">
              <span>🤖 智能体模式</span>
            </label>
            <button class="btn btn-secondary" onclick="clearChat()">清空对话</button>
          </div>

          <div class="input-row">
            <textarea id="q" placeholder="请输入医学问题，例如：高血压患者日常饮食应注意什么？"></textarea>
            <button class="btn btn-send" onclick="sendMsg()">发送</button>
          </div>
        </div>

        <div class="card" id="agentTraceCard" style="display:none;">
          <div class="card-title">🔧 智能体工具调用轨迹</div>
          <div id="agentTrace"></div>
        </div>

        <div class="bottom-panels">
          <div class="card">
            <div class="card-title">证据来源</div>
            <table class="sources-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>得分</th>
                  <th>标题</th>
                  <th>来源</th>
                </tr>
              </thead>
              <tbody id="sourcesBody">
                <tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:20px">暂无数据</td></tr>
              </tbody>
            </table>
          </div>

          <div class="card">
            <div class="card-title">调试信息</div>
            <pre id="out" class="json-box">{}</pre>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    requireLogin()

    function escapeHTML(str){
      return String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    }

    function addMsg(text, type){
      const box = document.getElementById("chatBox")
      const div = document.createElement("div")
      div.className = "msg " + type
      div.innerHTML = `
        <div class="bubble-wrap">
          <div class="avatar">${type === "user" ? "我" : "医"}</div>
          <div class="bubble">${escapeHTML(text).replace(/\n/g, "<br>")}</div>
        </div>
      `
      box.appendChild(div)
      box.scrollTop = box.scrollHeight
      return div
    }

    async function sendMsg(){
      const q = document.getElementById("q").value.trim()
      if(!q) return

      addMsg(q, "user")
      document.getElementById("q").value = ""

      const lang = document.getElementById("lang").value
      const agentMode = document.getElementById("agentMode").checked
      const fast_mode = document.getElementById("fastMode").checked

      if(agentMode){
        return sendAgent(q, lang)
      }

      const thinkingMsg = addMsg(fast_mode ? "快速生成中..." : "思考中...", "bot")

      try{
        const resp = await authFetch("/api/qa/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q, lang, fast_mode })
        })

        const data = await resp.json()
        document.getElementById("out").textContent = JSON.stringify(data, null, 2)
        const bubble = thinkingMsg.querySelector(".bubble")

        if(!resp.ok){
          bubble.innerText = data.error || "请求失败"
          return
        }

        bubble.innerHTML = escapeHTML(data.answer || "暂无回答").replace(/\n/g, "<br>")
        renderSources(data)
      }catch(e){
        thinkingMsg.querySelector(".bubble").innerText = "请求异常: " + e
      }
    }

    async function sendAgent(q, lang){
      const thinkingMsg = addMsg("🤖 智能体规划中（可能多步调用工具）...", "bot")
      try{
        const resp = await authFetch("/api/qa/agent/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: q, lang })
        })
        const data = await resp.json()
        document.getElementById("out").textContent = JSON.stringify(data, null, 2)
        const bubble = thinkingMsg.querySelector(".bubble")
        if(!resp.ok){
          bubble.innerText = data.error || "请求失败"
          return
        }
        const trace = data.tool_trace || []
        const chain = trace.map(t => t.tool).join(" → ")
        const prefix = chain ? `🔧 调用工具：${chain}（共 ${data.iterations || 0} 轮）\n\n` : ""
        bubble.innerHTML = escapeHTML(prefix + (data.answer || "暂无回答")).replace(/\n/g, "<br>")
        renderTrace(trace)
      }catch(e){
        thinkingMsg.querySelector(".bubble").innerText = "请求异常: " + e
      }
    }

    function renderTrace(trace){
      const card = document.getElementById("agentTraceCard")
      const box = document.getElementById("agentTrace")
      if(!trace || !trace.length){
        card.style.display = "none"
        box.innerHTML = ""
        return
      }
      card.style.display = "block"
      box.innerHTML = trace.map((t, i) => {
        const args = JSON.stringify(t.arguments || {})
        let res = JSON.stringify(t.result || {})
        if(res.length > 500) res = res.slice(0, 500) + "…"
        return `
          <div class="trace-step">
            <div class="trace-head">
              <span class="trace-idx">${i + 1}</span>
              <span class="trace-tool">🔧 ${escapeHTML(t.tool || "")}</span>
            </div>
            <div class="trace-kv"><span class="trace-label">参数</span><code>${escapeHTML(args)}</code></div>
            <div class="trace-kv"><span class="trace-label">结果</span><code>${escapeHTML(res)}</code></div>
          </div>`
      }).join("")
    }

    function renderSources(data){
      const tbody = document.getElementById("sourcesBody")
      const sources = data.sources || []
      if(!sources.length){
        tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;color:var(--text-muted);padding:20px'>无证据</td></tr>"
        return
      }

      tbody.innerHTML = sources.map((s, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${(s.score ?? 0).toFixed(3)}</td>
          <td>${escapeHTML(s.title || "-")}</td>
          <td>${escapeHTML(s.source || "-")}</td>
        </tr>
      `).join("")
    }

    function clearChat(){
      document.getElementById("chatBox").innerHTML = ""
      document.getElementById("sourcesBody").innerHTML = "<tr><td colspan='4' style='text-align:center;color:var(--text-muted);padding:20px'>暂无数据</td></tr>"
      document.getElementById("out").textContent = "{}"
      const traceCard = document.getElementById("agentTraceCard")
      if(traceCard){ traceCard.style.display = "none"; document.getElementById("agentTrace").innerHTML = "" }
    }

    document.getElementById("q").addEventListener("keydown", function(e){
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault()
        sendMsg()
      }
    })

    function goPage(url){ window.location.href = url }
    function logout(){
      localStorage.removeItem("jwt_access")
      localStorage.removeItem("jwt_refresh")
      window.location.href = "/login/"
    }
  </script>
</body>
</html>
