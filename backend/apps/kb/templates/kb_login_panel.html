<div id="kb_login_panel" style="position:fixed; inset:0; background:rgba(15, 23, 42, 0.45); display:none; align-items:center; justify-content:center; z-index:9999;">
  <div class="card" style="width:min(92vw, 420px); margin:0; box-shadow:0 20px 45px rgba(15, 23, 42, 0.18);">
    <div class="card-title">KB 登录 / 注册</div>
    <div class="form-group" style="margin-bottom:12px;">
      <label class="form-label" for="kb_login_user">用户名</label>
      <input id="kb_login_user" class="form-input" type="text" placeholder="请输入用户名" />
    </div>
    <div class="form-group" style="margin-bottom:12px;">
      <label class="form-label" for="kb_login_pwd">密码</label>
      <input id="kb_login_pwd" class="form-input" type="password" placeholder="请输入密码" />
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="kbLogin()">登录</button>
      <button class="btn btn-secondary" onclick="kbRegister()">注册</button>
      <button class="btn btn-secondary" onclick="hideLoginPanel()">关闭</button>
    </div>
    <div id="kb_login_error" style="color:#e11d48; margin-top:10px; font-size:12px;"></div>
  </div>
</div>
