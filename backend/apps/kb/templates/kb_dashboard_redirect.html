{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>术语知识库</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="{% static 'js/auth.js' %}"></script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: min(92vw, 420px);
      padding: 24px;
      border-radius: 18px;
      background: white;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      text-align: center;
    }

    .title { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
    .desc { font-size: 14px; color: #64748b; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="box">
    <div class="title">正在进入术语知识库</div>
    <div class="desc">系统会根据当前登录身份跳转到普通用户页面或管理员管理台。</div>
  </div>

  <script>
    (async function redirectByRole() {
      const toLogin = () => window.location.replace("/login/");
      const toLibrary = () => window.location.replace("/kb/library/");
      const toManage = () => window.location.replace("/kb/manage/");

      try {
        const token = getToken();
        if (!token) {
          toLogin();
          return;
        }

        const res = await authFetch("/api/auth/me/", { method: "GET" });
        if (!res.ok) {
          toLogin();
          return;
        }

        const me = await res.json();
        if (me.is_staff || me.is_superuser) {
          toManage();
          return;
        }
        toLibrary();
      } catch (error) {
        toLogin();
      }
    })();
  </script>
</body>
</html>
